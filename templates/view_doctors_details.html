<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Doctor Details</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>

  <body class="bg-light">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card mt-5">
            <div class="card-header">
              <h2 class="text-center">Doctor Details</h2>
            </div>
            <div class="card-body">
              <p class="card-text">Name: {{ doctor.name }}</p>
              <p class="card-text">Department: {{ doctor.department.name }}</p>
              <p class="card-text">Experience: {{ doctor.experience }} years</p>
              <p class="card-text">Description: {{ doctor.description }}</p>
            </div>

            <div class="mt-2 text-end mx-4 my-2">
              <a href="/patient/{{ patient_id }}/doctors/{{ doctor.id }}/availability" class="btn btn-primary">Check Availability</a>
              <a href="/patient/{{ patient_id }}/departments/{{ dept_id }}" class="btn btn-secondary">Back</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
