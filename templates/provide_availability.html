<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Provide Availability</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style > 
    .slot { margin: 2px; padding: 5px 10px; border: 1px solid #999; border-radius: 5px; font-weight: 600; }
    .on  { background: #d1f0d1; border-color: #198754; color: #198754; }
    .off { background: #f7d6d6; border-color: #dc3545; color: #dc3545; }
    .lock{ background: #ccc; border-color: #999; color: #666; cursor: not-allowed; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <!-- Left side -->
      <div class="d-flex align-items-center">
        <a class="navbar-brand fw-bold">Welcome Doctor</a>
        <a href="/doctor/{{ doctor.id }}/dashboard" class="navbar-brand ms-3">Home</a>
      </div>

      <!-- Right side -->
      <form action="/logout" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-danger">Log out</button>
      </form>
    </div>
  </nav>

  <div class="container mt-5">
    <h4>Provide Availability</h4>

    <table class="table table-borderless mt-4 border">
      <thead>
        <tr class="table-dark">
          <th>Date</th>
          <th class="text-center">Slots (Hourly 9am–7pm)</th>
        </tr>
      </thead>
      <tbody>
        {% for d in days %}
        <tr>
          <td>{{ d.strftime("%d-%m-%Y") }}</td>
          <td>
            {% for t in hours %}
              {% set key = (d, t) %}
              {% if key in booked %}
                <button class="slot lock" disabled>
                  {{ t.strftime("%H:%M") }}–{{ "%02d:00"|format(t.hour+1) }}
                </button>
              {% else %}
                <form method="POST" style="display:inline;">
                  <input type="hidden" name="date" value="{{ d.strftime('%Y-%m-%d') }}">
                  <input type="hidden" name="time" value="{{ t.strftime('%H:%M') }}">
                  <button class="slot {{ 'on' if key in selected else 'off' }}" type="submit">
                    {{ t.strftime("%H:%M") }}–{{ "%02d:00"|format(t.hour+1) }}
                  </button>
                </form>
              {% endif %}
            {% endfor %}
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <a href="/doctor/{{ doctor.id }}/dashboard" class="btn btn-primary">Back</a>
  </div>
</body>
</html>
