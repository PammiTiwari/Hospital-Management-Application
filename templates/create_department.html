<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Create Department</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>

  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <!-- Left side -->
        <div class="d-flex align-items-center">
          <a class="navbar-brand fw-bold">Welcome Admin</a>
         
          <a href="/admin/dashboard" class="navbar-brand ms-3">Home</a>
        </div>

        <!-- Right side -->
        <form class="d-flex">
          <div class="mx-2">
            <!-- Logout is POST in your app.py, must stay POST -->
            <form action="/logout" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger">Log out</button>
          </form>
          </div>
        </form>
      </div>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'error' else category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Main Container -->
    <div class="container mt-5">
      <div class="card shadow mx-auto" style="max-width: 450px">
        <div class="card-body">
          <h4 class="card-title mb-4 text-center">Add Department</h4>

     
          <form action="/admin/departments/create" method="post">
            <!-- Name -->
            <div class="mb-3">
              <label class="form-label" for="name">Name</label>
              <input class="form-control" type="text" id="name" name="name" required />
            </div>

            <!-- Overview -->
            <div class="mb-3">
              <label class="form-label" for="overview">Overview</label>
              <textarea class="form-control" id="overview" name="overview" rows="4" required></textarea>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Add Department</button>
            </div>
          </form>

        </div>
      </div>
    </div>

  <div class="container">
    <a href="/admin/dashboard" class="btn btn-secondary mb-3">Back to Dashboard</a>
  </div>
    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
