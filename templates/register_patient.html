<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Register Patient</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"/>
  </head>
  <body class="bg-light">
    <nav class="navbar sticky-top navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Hospital Management App</a>
        <a class="navbar-brand align-self-end" href="/login">Login</a>
      </div>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
         <div class="alert alert-{{ 'danger' if category == 'error' else category }} position-relative pe-5">
            {{ message }}
            <button type="button" class="btn-close position-absolute top-0 end-0 mt-3 me-2" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <div class="container mt-5">
      <div class="card shadow mx-auto form-card">
        <div class="card-body">
          <h4 class="card-title mb-4 text-center">Register</h4>

          <form action="/register_patient" method="post">
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input class="form-control" type="email" id="email" name="email" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="username">Username</label>
              <input class="form-control" type="text" id="username" name="username" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="name">Full Name</label>
              <input class="form-control" type="text" id="name" name="name" required />
            </div>


            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" type="password" id="password" name="password" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="age">Age</label>
              <input class="form-control" type="number" id="age" name="age" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="gender">Gender</label>
              <select class="form-select" id="gender" name="gender" aria-label="Select Gender" required>
                <option selected disabled value="">Choose Gender...</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="others">Others</option>
              </select>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Register</button>
            </div>

            <div class="mt-3 text-center">
              Already a user? <a href="/login">Go to Login</a>
            </div>
          </form>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
