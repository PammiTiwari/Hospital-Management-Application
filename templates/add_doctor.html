<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Add Doctor</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"/>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <div class="d-flex align-items-center">
          <a class="navbar-brand fw-bold">Welcome Admin</a>
          <a href="/admin/dashboard" class="navbar-brand ms-3">Home</a>
        </div>
        <div class="d-flex">
          <div class="mx-2">
            <form action="/logout" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger">Log out</button>
          </form>
          </div>
        </div>
      </div>
    </nav>

     {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
         <div class="alert alert-{{ 'danger' if category == 'error' else category }} position-relative pe-5">
            {{ message }}
            <button type="button" class="btn-close position-absolute top-0 end-0 mt-3 me-2" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="container mt-5">
      <div class="card shadow mx-auto form-card">
        <div class="card-body">
          <h4 class="card-title mb-4 text-center">Add Doctors</h4>

          <form action="/admin/doctors/create" method="post">
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input class="form-control" type="email" id="email" name="email" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="username">Username</label>
              <input class="form-control" type="text" id="username" name="username" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="name">Full Name</label>
              <input class="form-control" type="text" id="name" name="name" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="password">Assign Password</label>
              <input class="form-control" type="password" id="password" name="password" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="description">Description</label>
              <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label" for="experience">Experience (Years)</label>
              <input class="form-control" type="number" id="experience" name="experience" min="1" max="60" step="1" required />
            </div>

            <div class="mb-4">
              <label class="form-label" for="department_id">Select Department</label>
              <select class="form-select" id="department_id" name="department_id" required>
  <option selected disabled value="">Choose Department...</option>
  {% for d in departments %}
    <option value="{{ d.id }}">{{ d.name }}</option>
  {% endfor %}
</select>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Add Doctor</button>
            </div>
          </form>

        </div>
      </div>
    </div>
  <div class="container mt-5">
    <a href="/admin/dashboard" class="btn btn-secondary mb-3">Back to Dashboard</a>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
