<!DOCTYPE html>
<html lang="en">
<head>
  <title>Edit Patient</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>

<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold">Welcome Admin</a>
      <a href="/admin/dashboard" class="navbar-brand ms-3">Home</a>
    </div>
  </nav>

  <form action="/admin/patients/{{patient.id}}/edit" method="post" style="max-width:400px;margin:50px auto;" class="card p-4 shadow">

    <h4 class="text-center mb-3">Edit Patient</h4>

    <label>Name</label>
    <input type="text" name="name" value="{{patient.name}}" class="form-control mb-2"/>

    <label>Age</label>
    <input type="number" name="age" value="{{patient.age}}" class="form-control mb-2"/>

    <label>Gender</label>
    <select name="gender" class="form-select mb-3">
      <option value="">Keep Same</option>
      <option value="Male"   {% if patient.gender=='Male' %}selected{% endif %}>Male</option>
      <option value="Female" {% if patient.gender=='Female' %}selected{% endif %}>Female</option>
      <option value="Other"  {% if patient.gender=='Other' %}selected{% endif %}>Other</option>
    </select>

    <button class="btn btn-primary w-100 mb-2">Save</button>
    <a href="/admin/dashboard" class="btn btn-secondary w-100">Cancel</a>

  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
