<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>View department details</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>

  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <!-- Left side -->
        <div class="d-flex align-items-center">
          <a class="navbar-brand fw-bold">Department of {{ department.name }}</a>
          <a href="/patient/{{ patient_id }}/dashboard" class="navbar-brand ms-3">Home</a>
        </div>

        <!-- Right side -->
        <form action="/logout" method="post" class="d-inline">
          <button type="submit" class="btn btn-outline-danger">Log out</button>
        </form>
      </div>
    </nav>

    <!-- Overview -->
    <div class="text my-4 mx-5">
      <h3 class="fw-bold text-secondary">Overview</h3>
    </div>
    <div class="container">
      {{ department.overview }}
    </div>

    <!-- Doctors List -->
    <div class="text my-4 mx-5">
      <h3 class="fw-bold text-secondary">Doctors's List</h3>
    </div>

    <div class="container">
      <div class="card shadow-sm">
        <div class="card-body">
          {% if doctors %}
          <table class="table table-striped table-hover align-middle mb-0 ">
            <tbody>
              {% for doctor in doctors %}
              <tr>
                <td>{{ doctor.name }}</td>
                <td class="text-end my-4">
                  <a href="/patient/{{ patient_id }}/doctors/{{ doctor.id }}/availability" class="btn btn-primary btn-sm mx-4">Check Availability</a>
                  <a href="/patient/doctors/{{ doctor.id }}" class="btn btn-primary btn-sm">View Details</a>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
          {% else %}
          <p class="text-center">No doctors found</p>
          {% endif %}
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
